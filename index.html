<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0A0C10; --bg2:#11141B; --bg3:#161A23;
  --line:#232833; --line2:#2E3542;
  --ink:#EDEFF3; --dim:#9AA1B0; --faint:#68707F;
  --accent:#4C8DFF; --accent-dim:rgba(76,141,255,.14);
  --good:#34D3A6;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(1.15rem,4vw,4rem);
  --wrap:1200px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:70px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:#06080C}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15;letter-spacing:-.022em}
p{margin:0 0 .85rem;max-width:66ch}p:last-child{margin-bottom:0}
.mono{font-family:var(--mono);font-size:.85em}
.skip{position:absolute;left:-9999px;background:var(--accent);color:#06080C;
  padding:.6rem 1rem;font-weight:600;z-index:300;border-radius:6px}
.skip:focus{left:1rem;top:1rem}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--pad)}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(24px) scale(.98);
  transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* ───────── LOADER ───────── */
#loader{position:fixed;inset:0;z-index:400;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.1rem;
  transition:opacity .6s ease,visibility .6s ease}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader .mark{font-family:var(--mono);font-weight:700;font-size:1.7rem;letter-spacing:-.02em;
  color:var(--ink);display:flex;gap:.15rem;overflow:hidden}
#loader .mark i{color:var(--accent);font-style:normal}
#loader .bar{width:170px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
#loader .bar b{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#8b7bff);
  transition:width 1s cubic-bezier(.2,.7,.3,1)}
@media(prefers-reduced-motion:reduce){#loader{transition:none}#loader .bar b{transition:none}}

/* ───────── CUSTOM CURSOR ───────── */
@media(pointer:fine){
  html.cur, html.cur a, html.cur button, html.cur .chip, html.cur .card{cursor:none}
}
#cur-dot,#cur-ring{position:fixed;top:0;left:0;z-index:9999;border-radius:50%;pointer-events:none}
#cur-dot{width:6px;height:6px;background:var(--accent)}
#cur-ring{width:32px;height:32px;border:1px solid var(--accent);opacity:.5;
  transition:width .25s ease,height .25s ease,opacity .25s ease,background-color .25s ease}
html.cur-hover #cur-ring{width:56px;height:56px;opacity:.85;background:var(--accent-dim)}
html.cur-down #cur-ring{width:24px;height:24px}
@media(pointer:coarse){#cur-dot,#cur-ring{display:none}}

/* ───────── AMBIENT GRADIENT MESH ───────── */
.mesh{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;pointer-events:none;
  mix-blend-mode:screen;animation:drift 20s ease-in-out infinite}
.mesh.a{width:440px;height:440px;background:radial-gradient(circle,var(--accent),transparent 70%);
  top:-12%;left:56%}
.mesh.b{width:360px;height:360px;background:radial-gradient(circle,#8b5cf6,transparent 70%);
  bottom:-18%;left:4%;animation-delay:-8s}
.mesh.c{width:300px;height:300px;background:radial-gradient(circle,#34D3A6,transparent 72%);
  top:30%;left:2%;animation-delay:-14s;opacity:.22}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-34px,26px) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.mesh{animation:none}}

/* ───────── MAGNETIC / TILT ready-state ───────── */
.card,.hob{transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .22s ease}
.card{transform-style:preserve-3d}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity .3s ease;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 60%)}
.card:hover::after{opacity:1}
@media(pointer:coarse){.card,.hob{transform:none !important}}
@media(prefers-reduced-motion:reduce){.card,.hob{transition:border-color .22s ease}}

/* premium glow ring on the primary CTA */
.btn{position:relative}
.btn-key::before{content:"";position:absolute;inset:-2px;border-radius:10px;z-index:-1;opacity:0;
  background:linear-gradient(135deg,var(--accent),#8b7bff,var(--accent));background-size:220% 220%;
  transition:opacity .25s ease;animation:btnGlow 5s linear infinite}
.btn-key:hover::before{opacity:.6}
@keyframes btnGlow{to{background-position:220% 220%}}
@media(prefers-reduced-motion:reduce){.btn-key::before{animation:none}}

/* ───────── NAV ───────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(10,12,16,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;transition:border-color .3s,background-color .3s}
.nav.stuck{border-bottom-color:var(--line)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:.85rem var(--pad);
  display:flex;align-items:center;gap:1.5rem}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.03em;text-decoration:none}
.brand i{color:var(--accent);font-style:normal}
.nav ul{list-style:none;margin:0 0 0 auto;padding:0;display:flex;gap:1.5rem;font-size:.88rem}
.nav ul a{text-decoration:none;color:var(--faint);font-weight:500;transition:color .18s}
.nav ul a:hover{color:var(--ink)}
.nav ul a.on{color:var(--accent)}
@media(max-width:900px){.nav ul{display:none}}
.nav .cta{margin-left:auto}
@media(min-width:901px){.nav .cta{margin-left:0}}

/* ───────── BUTTONS ───────── */
.btn{display:inline-flex;align-items:center;gap:.45rem;font-size:.88rem;font-weight:600;
  text-decoration:none;padding:.6rem 1.15rem;border-radius:8px;border:1px solid var(--line2);
  color:var(--ink);background:var(--bg3);cursor:pointer;
  transition:background-color .18s,border-color .18s,transform .18s}
.btn:hover{background:#1D2330;border-color:var(--faint);transform:translateY(-1px)}
.btn-key{background:var(--accent);border-color:var(--accent);color:#06080C}
.btn-key:hover{background:#6BA1FF;border-color:#6BA1FF;transform:translateY(-1px)}
.btn-sm{padding:.45rem .9rem;font-size:.82rem}

/* ───────── HERO ───────── */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;
  padding-top:70px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(900px 600px at 78% 45%,transparent 30%,var(--bg) 82%),
             linear-gradient(90deg,var(--bg) 8%,rgba(10,12,16,.55) 42%,transparent 62%)}
.hero-in{position:relative;z-index:2;max-width:var(--wrap);margin:0 auto;
  padding:3rem var(--pad);width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);
  font-size:.76rem;color:var(--dim);border:1px solid var(--line);border-radius:20px;
  padding:.3rem .8rem;margin-bottom:1.5rem;background:rgba(17,20,27,.7)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--good);
  box-shadow:0 0 0 3px rgba(52,211,166,.16)}
.hero h1{font-size:clamp(2.8rem,1.5rem+7vw,6.4rem);line-height:.92;letter-spacing:-.045em;
  font-weight:700}
.hero h1 .two{display:block;color:var(--faint)}
.hero h1 .two b{color:var(--accent);font-weight:700}
.hero .sub{font-family:var(--mono);font-size:clamp(.82rem,.7rem+.4vw,1rem);color:var(--dim);
  margin:1.4rem 0 1rem;letter-spacing:-.01em}
.hero .lede{font-size:clamp(1rem,.95rem+.3vw,1.15rem);color:var(--dim);max-width:44ch;margin-bottom:2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.hero-face{position:absolute;right:var(--pad);bottom:clamp(1.5rem,5vh,3rem);z-index:2;
  display:flex;align-items:center;gap:.85rem}
.hero-face img{width:62px;height:62px;border-radius:50%;object-fit:cover;
  border:2px solid var(--line2)}
.hero-face span{font-size:.82rem;color:var(--faint);line-height:1.45}
@media(max-width:900px){.hero-face{display:none}}
.drag-hint{position:absolute;right:var(--pad);top:calc(70px + 1.5rem);z-index:2;
  font-family:var(--mono);font-size:.7rem;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;padding:.3rem .6rem;
  background:rgba(17,20,27,.7)}
@media(max-width:900px){.drag-hint{display:none}}

/* ───────── MARQUEE ───────── */
.marq{border-block:1px solid var(--line);background:var(--bg2);padding:1.15rem 0;
  overflow:hidden;position:relative}
.marq::before,.marq::after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none}
.marq::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
.marq::after{right:0;background:linear-gradient(270deg,var(--bg2),transparent)}
.marq-track{display:flex;gap:2.5rem;width:max-content;animation:slide 42s linear infinite}
@media(prefers-reduced-motion:reduce){.marq-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}
.marq:hover .marq-track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.logo{display:flex;align-items:center;gap:.55rem;flex:none;
  font-size:.83rem;color:var(--faint);white-space:nowrap}
.logo img{width:24px;height:24px;object-fit:contain;opacity:.85}
.logo img.inv{filter:invert(1) brightness(1.5)}

/* ───────── STATS ───────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--bg2);padding:1.4rem 1.25rem}
.stat .n{font-size:clamp(1.7rem,1.3rem+1.4vw,2.4rem);font-weight:700;letter-spacing:-.04em;
  color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.84rem;color:var(--dim);margin-top:.45rem;line-height:1.4}

/* ───────── SECTIONS ───────── */
.sec{padding-block:clamp(3.5rem,8vw,6.5rem)}
.sec-top{margin-bottom:2.5rem}
.kicker{font-family:var(--mono);font-size:.74rem;color:var(--accent);
  display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.kicker::after{content:"";height:1px;flex:1;background:var(--line);max-width:120px}
.sec h2{font-size:clamp(1.65rem,1.2rem+1.8vw,2.5rem);letter-spacing:-.035em}
.sec-note{color:var(--dim);max-width:56ch;margin-top:.7rem}

/* ───────── EXPERIENCE ───────── */
.job{border:1px solid var(--line);border-radius:14px;background:var(--bg2);
  padding:clamp(1.3rem,3vw,2rem);position:relative;overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.job-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;
  padding-bottom:.9rem;border-bottom:1px solid var(--line);margin-bottom:1.3rem}
.job-h h3{font-size:1.2rem}
.job-h .when{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--faint);
  background:var(--bg3);border-radius:20px;padding:.2rem .7rem;white-space:nowrap}
.job-h .prod{width:100%;color:var(--accent);font-size:.9rem;font-weight:500}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.pts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8rem;
  color:var(--dim);font-size:.95rem}
.pts li::before{content:"";width:6px;height:6px;margin-top:.62em;border-radius:2px;
  background:var(--accent);transform:rotate(45deg)}
.pts b{color:var(--ink);font-weight:600}
.pts code{font-family:var(--mono);font-size:.85em;background:var(--bg3);
  padding:.1rem .35rem;border-radius:4px;color:var(--ink)}

/* ───────── PROJECTS ───────── */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.6rem}
.chip{font-family:inherit;font-size:.81rem;font-weight:600;padding:.35rem .85rem;
  border:1px solid var(--line2);border-radius:20px;background:transparent;color:var(--dim);
  cursor:pointer;transition:background-color .16s,border-color .16s,color .16s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06080C}

.cards{display:grid;gap:1.1rem}
.card{border:1px solid var(--line);border-radius:14px;background:var(--bg2);
  padding:clamp(1.25rem,3vw,1.9rem);position:relative;
  transition:border-color .22s ease,transform .22s ease}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card[hidden]{display:none}
.card .num{position:absolute;top:1.1rem;right:1.2rem;font-family:var(--mono);
  font-size:.78rem;color:var(--line2);font-weight:500}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:.45rem .7rem;margin-bottom:.2rem;
  padding-right:2.5rem}
.card-h h3{font-size:1.2rem}
.badge{font-family:var(--mono);font-size:.66rem;padding:.16rem .5rem;border-radius:5px;
  font-weight:500;white-space:nowrap}
.badge.live{color:var(--good);background:rgba(52,211,166,.12)}
.badge.wip{color:#E8B341;background:rgba(232,179,65,.12)}
.badge.nda{color:var(--faint);background:var(--bg3)}
.card .kind{font-size:.81rem;color:var(--faint);display:block;margin-bottom:.85rem}
.card p{color:var(--dim);max-width:64ch;font-size:.95rem}
.card p b{color:var(--ink);font-weight:600}

/* architecture flow strip */
.flowstrip{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:1.2rem 0 0;
  padding:.9rem 1rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  position:relative;overflow:hidden}
.flowstrip .fnode{font-family:var(--mono);font-size:.71rem;color:var(--dim);
  background:var(--bg3);border:1px solid var(--line);border-radius:6px;
  padding:.28rem .6rem;white-space:nowrap}
.flowstrip .farr{width:22px;height:1px;background:var(--line2);flex:none;position:relative}
.flowstrip .farr::after{content:"";position:absolute;right:0;top:-2px;
  border-left:4px solid var(--line2);border-block:2.5px solid transparent}
.flowstrip .pulse{position:absolute;left:0;top:0;height:2px;width:34px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent)}
@media(prefers-reduced-motion:no-preference){
  .flowstrip .pulse{animation:run 3.4s linear infinite}
  @keyframes run{0%{left:-40px;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
}

.stack{display:flex;flex-wrap:wrap;gap:.35rem;margin:1.1rem 0 0;padding:0;list-style:none}
.stack li{font-family:var(--mono);font-size:.7rem;color:var(--dim);background:var(--bg3);
  border-radius:5px;padding:.2rem .5rem}

details.more{margin-top:1.05rem;border-top:1px solid var(--line);padding-top:.85rem}
details.more summary{font-size:.86rem;font-weight:600;color:var(--accent);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" +";font-family:var(--mono)}
details.more[open] summary::after{content:" \2212"}
.dl{list-style:none;margin:1.1rem 0 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1.05rem 1.8rem}
.dl li{border-top:1px solid var(--line);padding-top:.7rem}
.dl h4{font-size:.88rem;margin-bottom:.28rem;color:var(--ink)}
.dl p{margin:0;font-size:.88rem;line-height:1.55;max-width:42ch;color:var(--dim)}

.links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.25rem}

/* ───────── CHARTS ───────── */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.1rem}
.chart{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:1.4rem}
.chart h3{font-size:1rem;margin-bottom:.25rem}
.chart .cap{font-size:.8rem;color:var(--faint);margin-bottom:1.2rem}
.chart svg{width:100%;height:auto;overflow:visible}
.bar-h{fill:var(--accent)}
.bar-g{fill:var(--line2)}
.axis{stroke:var(--line);stroke-width:1}
.tick{fill:var(--faint);font-family:var(--mono);font-size:9px}
.vlabel{fill:var(--dim);font-family:var(--mono);font-size:9.5px}
.grow{transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.7,.3,1)}
.in .grow{transform:scaleX(1)}
.growY{transform:scaleY(0);transform-origin:bottom;transition:transform .9s cubic-bezier(.2,.7,.3,1)}
.in .growY{transform:scaleY(1)}
.radar-web{fill:none;stroke:var(--line);stroke-width:1}
.radar-area{fill:rgba(76,141,255,.2);stroke:var(--accent);stroke-width:1.5;
  opacity:0;transition:opacity .9s ease .2s}
.in .radar-area{opacity:1}
.radar-dot{fill:var(--accent)}
.radar-lab{fill:var(--dim);font-size:9.5px;font-family:var(--mono)}

/* ───────── TIMELINE / ROWS ───────── */
.tl{list-style:none;margin:0;padding:0 0 0 1.5rem;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:.5rem;bottom:.5rem;width:1px;background:var(--line)}
.tl li{position:relative;padding:0 0 1.6rem}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-1.5rem;top:.5rem;width:9px;height:9px;
  border-radius:50%;background:var(--bg);border:2px solid var(--line2)}
.tl li.hi::before{border-color:var(--accent);background:var(--accent)}
.tl .yr{font-family:var(--mono);font-size:.74rem;color:var(--accent);display:block;margin-bottom:.2rem}
.tl h3{font-size:1rem;margin-bottom:.2rem}
.tl .sub{color:var(--dim);font-size:.91rem;margin:0;max-width:60ch}
.tl .mk{display:inline-block;margin-top:.45rem;font-family:var(--mono);font-size:.72rem;
  color:var(--accent);background:var(--accent-dim);border-radius:5px;padding:.15rem .5rem}

.rows{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:.7rem}
.rows li{display:flex;flex-direction:column;gap:.15rem;border:1px solid var(--line);
  border-radius:10px;background:var(--bg2);padding:.85rem 1rem;font-size:.93rem;
  transition:border-color .18s}
.rows li:hover{border-color:var(--line2)}
.rows .sub{color:var(--faint);font-size:.83rem}
.rows .date{font-family:var(--mono);font-size:.71rem;color:var(--accent);margin-top:.2rem}
.rows a{color:var(--accent);text-decoration:none}
.rows a:hover{text-decoration:underline}

/* ───────── BEYOND ───────── */
.beyond-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);
  gap:clamp(1.5rem,4vw,3rem);align-items:start}
@media(max-width:820px){.beyond-wrap{grid-template-columns:1fr}}
.hobbies{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
.hob{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:1.15rem;
  transition:border-color .18s,transform .18s}
.hob:hover{border-color:var(--line2);transform:translateY(-2px)}

  // splits only the direct text nodes of `el` into inline char spans,
  // leaving any child elements (e.g. the accent <b>.</b>) untouched
  function splitDirectText(el){
    if (!el) return;
    [].slice.call(el.childNodes).forEach(function(node){
      if (node.nodeType !== 3 || !node.textContent) return;
      var frag = document.createDocumentFragment();
      node.textContent.split("").forEach(function(ch){
        var span = document.createElement("span");
        span.className = "gchar";
        span.style.display = "inline-block";
        span.textContent = ch === " " ? " " : ch;
        frag.appendChild(span);
      });
      node.parentNode.replaceChild(frag, node);
    });
  }

  splitDirectText(h1);
  splitDirectText(h1.querySelector(".two"));
  splitDirectText(h1.querySelector(".two b"));

  var chars = h1.querySelectorAll(".gchar");

/* ---------- CHARTS (hand-drawn SVG) ---------- */
function barsH(d){
  var W = 300, rowH = 30, pad = 78, max = Math.max.apply(null, d.rows.map(function(r){ return r.v; }));
  var H = d.rows.length * rowH + 10;
  var bars = d.rows.map(function(r, i){
    var w = Math.max(2, (r.v / max) * (W - pad - 42));
    var y = i * rowH + 6;
    return '<text class="vlabel" x="0" y="' + (y + 11) + '">' + esc(r.l) + '</text>' +
      '<rect class="bar-h grow" x="' + pad + '" y="' + y + '" width="' + w + '" height="11" rx="3" ' +
      'style="transition-delay:' + (i * 110) + 'ms"></rect>' +
      '<text class="tick" x="' + (pad + w + 7) + '" y="' + (y + 10) + '">' + r.v + ' ms</text>';
  }).join("");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(d.title) + '">' + bars + '</svg>';
}

function barsV(d){
  var W = 300, H = 170, pad = 26, max = Math.max.apply(null, d.rows.map(function(r){ return r.v; }));
  var bw = (W - pad * 2) / d.rows.length;
  var bars = d.rows.map(function(r, i){
    var h = Math.max(3, (r.v / max) * (H - 52));
    var x = pad + i * bw + bw * 0.2, w = bw * 0.6, y = H - 26 - h;
    return '<rect class="bar-h growY" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="4" style="transition-delay:' + (i * 110) + 'ms"></rect>' +
      '<text class="tick" x="' + (x + w / 2) + '" y="' + (y - 6) + '" text-anchor="middle">' + r.v + '</text>' +
      '<text class="vlabel" x="' + (x + w / 2) + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(r.l) + '</text>';
  }).join("");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(d.title) + '">' +
    '<line class="axis" x1="' + pad + '" y1="' + (H - 26) + '" x2="' + (W - pad) + '" y2="' + (H - 26) + '"></line>' +
    bars + '</svg>';
}

function radar(d){
  var S = 210, c = S / 2, R = 66, n = d.axes.length;
  function pt(i, r){
    var a = (Math.PI * 2 * i / n) - Math.PI / 2;
    return [c + Math.cos(a) * r, c + Math.sin(a) * r];
  }
  var web = "";
  [0.25, 0.5, 0.75, 1].forEach(function(f){
    var p = d.axes.map(function(_, i){ return pt(i, R * f).join(","); }).join(" ");
    web += '<polygon class="radar-web" points="' + p + '"></polygon>';
  });
  d.axes.forEach(function(_, i){
    var e = pt(i, R);
    web += '<line class="radar-web" x1="' + c + '" y1="' + c + '" x2="' + e[0] + '" y2="' + e[1] + '"></line>';
  });
  var poly = d.axes.map(function(a, i){ return pt(i, R * a.v / 100).join(","); }).join(" ");
  var dots = d.axes.map(function(a, i){
    var p = pt(i, R * a.v / 100);
    return '<circle class="radar-dot" cx="' + p[0] + '" cy="' + p[1] + '" r="2.5"></circle>';
  }).join("");
  var labs = d.axes.map(function(a, i){
    var p = pt(i, R + 20), anchor = Math.abs(p[0] - c) < 12 ? "middle" : (p[0] > c ? "start" : "end");
    return '<text class="radar-lab" x="' + p[0] + '" y="' + (p[1] + 3) + '" text-anchor="' + anchor + '">' +
      esc(a.l) + '</text>';
  }).join("");
  return '<svg viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="' + esc(d.title) + '">' +
    web + '<polygon class="radar-area" points="' + poly + '"></polygon>' + dots + labs + '</svg>';
}

  return '<div class="chart rv" style="transition-delay:' + ((i || 0) * 140) + 'ms"><h3>' + esc(d.title) + '</h3>' +
    '<p class="cap">' + esc(d.cap) + '</p>' + svg + '</div>';
}

/* ---------- REDUCED MOTION / INPUT FLAGS ---------- */
var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var FINE_POINTER = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
var HAS_GSAP = typeof gsap !== "undefined";

/* ---------- LOADER ---------- */
(function(){
  var loader = document.getElementById("loader"), bar = document.getElementById("loader-bar");
  if (!loader) return;
  var finish = function(){ loader.classList.add("done"); };
  if (REDUCE){ finish(); return; }
  requestAnimationFrame(function(){ if (bar) bar.style.width = "100%"; });
  setTimeout(finish, 750);
  loader.addEventListener("transitionend", function(e){
    if (e.propertyName === "opacity") loader.remove();
  });
})();

/* ---------- SMOOTH SCROLL (Lenis) ---------- */
(function(){
  if (REDUCE || typeof Lenis === "undefined") return;
  var lenis = new Lenis({ duration: 1.05, smoothWheel: true });
  function raf(time){ lenis.raf(time); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
})();

/* ---------- CUSTOM CURSOR ---------- */
(function(){
  if (!FINE_POINTER) return;
  var dot = document.getElementById("cur-dot"), ring = document.getElementById("cur-ring");
  if (!dot || !ring) return;
  document.documentElement.classList.add("cur");
  var ringX = HAS_GSAP && !REDUCE ? gsap.quickTo(ring, "x", { duration: .35, ease: "power3" }) : null;
  var ringY = HAS_GSAP && !REDUCE ? gsap.quickTo(ring, "y", { duration: .35, ease: "power3" }) : null;
  window.addEventListener("mousemove", function(e){
    dot.style.transform = "translate(" + (e.clientX - 3) + "px," + (e.clientY - 3) + "px)";
    if (ringX){ ringX(e.clientX - 16); ringY(e.clientY - 16); }
    else ring.style.transform = "translate(" + (e.clientX - 16) + "px," + (e.clientY - 16) + "px)";
  }, { passive: true });
  document.addEventListener("mousedown", function(){ document.documentElement.classList.add("cur-down"); });
  document.addEventListener("mouseup", function(){ document.documentElement.classList.remove("cur-down"); });
  var HOVER_SEL = "a, button, .chip, .card, .hob, .reach a";
  document.addEventListener("mouseover", function(e){
    if (e.target.closest(HOVER_SEL)) document.documentElement.classList.add("cur-hover");
  });
  document.addEventListener("mouseout", function(e){
    if (e.target.closest(HOVER_SEL) && !(e.relatedTarget && e.relatedTarget.closest(HOVER_SEL)))
      document.documentElement.classList.remove("cur-hover");
  });
})();

/* ---------- MAGNETIC BUTTONS ---------- */
(function(){
  if (!FINE_POINTER || !HAS_GSAP || REDUCE) return;
  [].slice.call(document.querySelectorAll(".btn, .chip")).forEach(function(el){
    var xTo = gsap.quickTo(el, "x", { duration: .45, ease: "power3" });
    var yTo = gsap.quickTo(el, "y", { duration: .45, ease: "power3" });
    el.addEventListener("mousemove", function(e){
      var r = el.getBoundingClientRect();
      xTo((e.clientX - r.left - r.width / 2) * .28);
      yTo((e.clientY - r.top - r.height / 2) * .28);
    });
    el.addEventListener("mouseleave", function(){ xTo(0); yTo(0); });
  });
})();

/* ---------- 3D TILT CARDS ---------- */
(function(){
  if (!FINE_POINTER || REDUCE) return;
  [].slice.call(document.querySelectorAll(".card, .hob")).forEach(function(el){
    el.addEventListener("mousemove", function(e){
      var r = el.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      var rx = (0.5 - py) * 10, ry = (px - 0.5) * 12;
      el.style.transform = "perspective(900px) rotateX(" + rx + "deg) rotateY(" + ry + "deg) translateZ(6px)";
      el.style.setProperty("--mx", (px * 100) + "%");
      el.style.setProperty("--my", (py * 100) + "%");
    });
    el.addEventListener("mouseleave", function(){ el.style.transform = ""; });
  });
})();

/* ---------- SCROLL REVEAL ---------- */
(function(){
  var els = [].slice.call(document.querySelectorAll(".rv"));
  if (!("IntersectionObserver" in window)){
    els.forEach(function(e){ e.classList.add("in"); }); return;
  }
  var io = new IntersectionObserver(function(en){
    en.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  els.forEach(function(e){ io.observe(e); });
})();

/* ---------- COUNT UP ---------- */
(function(){
  var box = document.getElementById("statwrap");
  if (!box) return;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var run = function(){
    [].slice.call(box.querySelectorAll(".n")).forEach(function(el){
      var to = +el.dataset.to, sfx = el.dataset.suffix || "";
      if (reduce){ el.textContent = to + sfx; return; }
      var t0 = null, dur = 1200;
      var step = function(ts){
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(to * e) + sfx;
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  };
  if (!("IntersectionObserver" in window)) return run();
  var io = new IntersectionObserver(function(en){
    if (en[0].isIntersecting){ run(); io.disconnect(); }
  }, { threshold: 0.35 });
  io.observe(box);
})();

  if (!bar) return;

/* ---------- NAV: stuck border + active link ---------- */
(function(){
  var nav = document.getElementById("nav"), ticking = false;
  var onScroll = function(){
    nav.classList.toggle("stuck", window.scrollY > 16);
    ticking = false;
  };
  window.addEventListener("scroll", function(){
    if (!ticking){ requestAnimationFrame(onScroll); ticking = true; }
  }, { passive: true });
  onScroll();

  var links = [].slice.call(document.querySelectorAll("#navlinks a"));
  if (!links.length || !("IntersectionObserver" in window)) return;
  var map = {};
  links.forEach(function(a){ map[a.getAttribute("href").slice(1)] = a; });
  var io = new IntersectionObserver(function(en){
    en.forEach(function(e){
      var a = map[e.target.id];
      if (a && e.isIntersecting){
        links.forEach(function(l){ l.classList.remove("on"); });
        a.classList.add("on");
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  Object.keys(map).forEach(function(id){
    var s = document.getElementById(id); if (s) io.observe(s);
  });
})();

/* ══════════════════════════════════════════════════════════════════
   3D HERO — the CBIT Guru request path as a rotating node graph.
   Nodes and edges come from SITE.scene, so editing the data
   changes the geometry.
   ══════════════════════════════════════════════════════════════════ */
(function(){
  var canvas = document.getElementById("scene");
  if (!canvas || typeof THREE === "undefined") return;

  var host = canvas.parentNode;
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (err) { canvas.style.display = "none"; return; }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = host.clientWidth, H = host.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H, false);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 100);
  camera.position.set(0.5, 0.6, 11.5);

  var group = new THREE.Group();
  scene.add(group);

  var ACCENT = 0x4C8DFF, MUTED = 0x2E3542, INK = 0x9AA1B0;

  // --- nodes ---
  var byId = {}, nodeMeshes = [];
  SITE.scene.nodes.forEach(function(n, ni){
    var v = new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2]);
    byId[n.id] = v;
    var core = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 20, 20),
      new THREE.MeshBasicMaterial({ color: ACCENT })
    );
    core.position.copy(v);
    group.add(core);
    var halo = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 16, 16),
      new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    halo.position.copy(v);
    group.add(halo);
    nodeMeshes.push({ mesh: core, halo: halo, label: n.label, v: v, phase: ni * 1.3 });
  });

  // --- edges ---
  SITE.scene.edges.forEach(function(e){
    var a = byId[e[0]], b = byId[e[1]];
    if (!a || !b) return;
    var g = new THREE.BufferGeometry().setFromPoints([a, b]);
    group.add(new THREE.Line(g, new THREE.LineBasicMaterial({
      color: MUTED, transparent: true, opacity: 0.85
    })));
  });

  // --- starfield for depth ---
  var starGeo = new THREE.BufferGeometry();
  var sv = [];
  for (var i = 0; i < 420; i++){
    sv.push((Math.random() - 0.5) * 34, (Math.random() - 0.5) * 22, (Math.random() - 0.5) * 24);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sv, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: INK, size: 0.045, transparent: true, opacity: 0.5
  })));

  // --- sparse glowing sparkle field, additive-blended for a "crazy 3D" pop ---
  var sparkGeo = new THREE.BufferGeometry();
  var spv = [];
  for (var sp = 0; sp < 90; sp++){
    spv.push((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 12);
  }
  sparkGeo.setAttribute("position", new THREE.Float32BufferAttribute(spv, 3));
  var sparkField = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
    color: ACCENT, size: 0.05, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  group.add(sparkField);

  // --- ambient outer wireframe shape, drifts independently for depth ---
  var ambient = new THREE.Mesh(
    new THREE.IcosahedronGeometry(6.2, 1),
    new THREE.MeshBasicMaterial({
      color: ACCENT, wireframe: true, transparent: true, opacity: 0.06,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  scene.add(ambient);

  // --- travelling pulse along the request path ---
  var pathPts = SITE.scene.path.map(function(id){ return byId[id]; }).filter(Boolean);
  var pulse = new THREE.Mesh(
    new THREE.SphereGeometry(0.11, 14, 14),
    new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
  );
  if (pathPts.length > 1) group.add(pulse);

  // --- labels projected from 3D to HTML ---
  var labelBox = document.createElement("div");
  labelBox.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:1";
  host.appendChild(labelBox);
  nodeMeshes.forEach(function(n){
    var d = document.createElement("span");
    d.textContent = n.label;
    d.style.cssText = "position:absolute;font-family:var(--mono);font-size:10px;" +
      "color:var(--dim);white-space:nowrap;transform:translate(10px,-50%);" +
      "text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)";
    labelBox.appendChild(d);
    n.el = d;
  });

  // --- drag to rotate ---
  var drag = false, px = 0, py = 0, tx = 0, ty = 0, cx = 0, cy = 0;
  var down = function(e){ drag = true; px = (e.touches ? e.touches[0] : e).clientX;
                          py = (e.touches ? e.touches[0] : e).clientY; };
  var move = function(e){
    if (!drag) return;
    var x = (e.touches ? e.touches[0] : e).clientX, y = (e.touches ? e.touches[0] : e).clientY;
    tx += (x - px) * 0.005; ty += (y - py) * 0.005;
    ty = Math.max(-0.7, Math.min(0.7, ty));
    px = x; py = y;
  };
  var up = function(){ drag = false; };
  canvas.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  canvas.addEventListener("touchstart", down, { passive: true });
  canvas.addEventListener("touchmove", move, { passive: true });
  canvas.addEventListener("touchend", up);

  // --- mouse parallax (independent of drag) ---
  var mx = 0, my = 0;
  window.addEventListener("mousemove", function(e){
    mx = (e.clientX / window.innerWidth) * 2 - 1;
    my = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  // --- resize ---
  var resize = function(){
    W = host.clientWidth; H = host.clientHeight;
    if (!W || !H) return;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    renderer.setSize(W, H, false);
  };
  window.addEventListener("resize", resize);

  // --- loop ---
  var t = 0, visible = true, vec = new THREE.Vector3();
  document.addEventListener("visibilitychange", function(){ visible = !document.hidden; });

  function frame(){
    requestAnimationFrame(frame);
    if (!visible) return;

    if (!reduce && !drag) tx += 0.0016;
    var targetX = tx + (reduce ? 0 : mx * 0.18);
    var targetY = ty + (reduce ? 0 : my * 0.12);
    cx += (targetX - cx) * 0.06;
    cy += (targetY - cy) * 0.06;
    group.rotation.y = cx;
    group.rotation.x = cy;

    if (!reduce && pathPts.length > 1){
      t = (t + 0.0032) % 1;
      var seg = t * (pathPts.length - 1);
      var i = Math.floor(seg), f = seg - i;
      var a = pathPts[i], b = pathPts[Math.min(i + 1, pathPts.length - 1)];
      pulse.position.lerpVectors(a, b, f);
    }

    // glowing halo pulse + ambient shape drift + scroll-linked camera dolly
    var now = performance.now() * 0.001;
    for (var hk = 0; hk < nodeMeshes.length; hk++){
      var nm = nodeMeshes[hk];
      var s = reduce ? 1 : 1 + Math.sin(now * 1.1 + nm.phase) * 0.22;
      nm.halo.scale.setScalar(s);
    }
    if (!reduce){
      ambient.rotation.y -= 0.0009;
      ambient.rotation.x += 0.0004;
      var scrollFrac = Math.min(1, Math.max(0, window.scrollY / (window.innerHeight || 1)));
      camera.position.z = 11.5 + scrollFrac * 2.4;
      ambient.material.opacity = 0.06 * (1 - scrollFrac * 0.6);
    }

    renderer.render(scene, camera);

    // reposition labels
    for (var k = 0; k < nodeMeshes.length; k++){
      var n = nodeMeshes[k];
      vec.copy(n.v).applyMatrix4(group.matrixWorld).project(camera);
      n.el.style.left = ((vec.x * 0.5 + 0.5) * W) + "px";
      n.el.style.top  = ((-vec.y * 0.5 + 0.5) * H) + "px";
      n.el.style.opacity = vec.z < 1 ? "1" : "0";
    }
  }
  resize();
  frame();
})();

/* ---------- SEO: Person schema ---------- */
(function(){
  var s = document.createElement("script");
  s.type = "application/ld+json";
  s.textContent = JSON.stringify({
    "@context":"https://schema.org", "@type":"Person",
    name: SITE.first + " " + SITE.last,
    jobTitle: "Software Development Engineer",
    email: "mailto:" + SITE.links.email,
    image: SITE.photo || undefined,
    address: { "@type":"PostalAddress", addressLocality: SITE.location },
    worksFor: { "@type":"Organization", name:"Zapcom Solutions" },
    sameAs: [SITE.links.linkedin, SITE.links.github, SITE.links.leetcode].filter(Boolean),
    alumniOf: SITE.path.filter(function(p){ return /Institute|Technology|School/.test(p.title); })
      .map(function(p){ return { "@type":"EducationalOrganization", name:p.title }; })
  });
  document.head.appendChild(s);
})();
</script>
</body>
